# Branch-level admin panel.
# Replace admin.yourdomain.com with your real domain, then get a cert with:
#   sudo certbot --nginx -d admin.yourdomain.com

server {
    listen 80;
    server_name admin.yourdomain.com;

    root /var/www/salon/admin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
