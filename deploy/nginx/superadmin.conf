# Multi-branch superadmin panel.
# Replace superadmin.yourdomain.com with your real domain, then get a cert with:
#   sudo certbot --nginx -d superadmin.yourdomain.com

server {
    listen 80;
    server_name superadmin.yourdomain.com;

    root /var/www/salon/superadmin;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
