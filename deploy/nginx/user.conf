# Customer-facing storefront (the "user" app).
# Replace yourdomain.com with your real domain, then get a cert with:
#   sudo certbot --nginx -d yourdomain.com -d www.yourdomain.com

server {
    listen 80;
    server_name yourdomain.com www.yourdomain.com;

    root /var/www/salon/user;
    index index.html;

    # Client-side routing (React Router) - let the app handle unknown paths
    # instead of nginx 404ing on a hard refresh of e.g. /services/123.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed build assets; index.html itself is never cached so
    # deploys take effect immediately.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
