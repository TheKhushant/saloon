# Reverse proxy to the Spring Boot backend running on localhost:5000
# (started by the salon-backend.service systemd unit).
#
# Replace api.yourdomain.com with your real domain, then get a cert with:
#   sudo certbot --nginx -d api.yourdomain.com

server {
    listen 80;
    server_name api.yourdomain.com;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # The backend already sets its own CORS headers based on
        # CORS_ORIGINS in .env - nginx doesn't need to add any here.
    }
}
