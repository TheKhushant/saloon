spring:
  application:
    name: salon-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/salon}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:riya2003}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none   # schema is owned by Flyway migrations, not Hibernate
    properties:
      hibernate:
        jdbc.time_zone: UTC
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
    time-zone: UTC
  servlet:
    multipart:
      enabled: true
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: ${PORT:5000}
  shutdown: graceful   # let in-flight requests finish on SIGTERM
  error:
    include-message: always
    include-stacktrace: on_param

spring-boot:
  lifecycle:
    timeout-per-shutdown-phase: 15s

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:5175,http://localhost:8080,http://localhost:8081,http://localhost:8082}
  uploads:
    # Where uploaded product/service images are stored on disk. Served back
    # out at /uploads/** (see WebConfig) - so this directory needs to be
    # writable by whichever user runs the backend process, and ideally
    # backed up/persisted across deploys (it's NOT inside the jar or the
    # git repo).
    dir: ${UPLOADS_DIR:./uploads}
    # Public base URL the frontend uses to actually load an uploaded image.
    # In production this should be the same domain/host serving /uploads,
    # e.g. https://api.yourdomain.com/uploads
    public-base-url: ${UPLOADS_PUBLIC_BASE_URL:http://localhost:5000/uploads}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-ms: ${JWT_EXPIRATION_MS:604800000}   # 7 days
  rate-limit:
    auth:
      capacity: 20
      refill-per-window: 20
      window-minutes: 15
    booking:
      capacity: 30
      refill-per-window: 30
      window-minutes: 10
    chat:
      capacity: 20
      refill-per-window: 20
      window-minutes: 15
    general:
      capacity: 300
      refill-per-window: 300
      window-minutes: 15
  seed:
    enabled: ${SEED_ENABLED:false}
    superadmin-email: ${SEED_SUPERADMIN_EMAIL:superadmin@salon.com}
    superadmin-password: ${SEED_SUPERADMIN_PASSWORD:Password@123}
  chat:
    # If blank, the chat endpoint returns a clear "not configured" error
    # instead of crashing the app - the chatbot is a supplementary feature,
    # not something that should be able to take down bookings/admin if
    # misconfigured.
    anthropic-api-key: ${ANTHROPIC_API_KEY:}
    model: ${ANTHROPIC_MODEL:claude-sonnet-5}
    max-tokens: ${ANTHROPIC_MAX_TOKENS:1024}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true





      