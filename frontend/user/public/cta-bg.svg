<svg xmlns="http://www.w3.org/2000/svg" width="800" height="500" viewBox="0 0 800 500">
  <defs>
    <linearGradient id="base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="hsl(20, 25%, 10%)" />
      <stop offset="100%" stop-color="hsl(20, 18%, 20%)" />
    </linearGradient>

    <pattern id="diagonalLines" width="46" height="46" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="46" height="46" fill="transparent" />
      <line x1="0" y1="0" x2="0" y2="46" stroke="hsl(38, 60%, 55%)" stroke-opacity="0.10" stroke-width="14" />
    </pattern>

    <g id="scissors">
      <circle cx="0" cy="0" r="6.5" fill="none" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.35" stroke-width="2.4" />
      <circle cx="26" cy="10" r="6.5" fill="none" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.35" stroke-width="2.4" />
      <line x1="4.6" y1="4.6" x2="46" y2="-30" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.35" stroke-width="2.4" stroke-linecap="round" />
      <line x1="22" y1="4.8" x2="-14" y2="-32" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.35" stroke-width="2.4" stroke-linecap="round" />
    </g>

    <g id="comb">
      <rect x="0" y="0" width="34" height="8" rx="2" fill="none" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" />
      <line x1="3" y1="8" x2="3" y2="26" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round" />
      <line x1="10" y1="8" x2="10" y2="26" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round" />
      <line x1="17" y1="8" x2="17" y2="26" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round" />
      <line x1="24" y1="8" x2="24" y2="26" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round" />
      <line x1="31" y1="8" x2="31" y2="26" stroke="hsl(38, 65%, 62%)" stroke-opacity="0.3" stroke-width="2.2" stroke-linecap="round" />
    </g>
  </defs>

  <rect width="800" height="500" fill="url(#base)" />
  <rect width="800" height="500" fill="url(#diagonalLines)" />

  <use href="#scissors" x="70" y="90" />
  <use href="#scissors" x="620" y="60" transform="rotate(35 620 60)" />
  <use href="#scissors" x="360" y="380" transform="rotate(-20 360 380)" />
  <use href="#scissors" x="720" y="410" transform="rotate(15 720 410)" />
  <use href="#scissors" x="150" y="420" transform="rotate(60 150 420)" />

  <use href="#comb" x="230" y="140" transform="rotate(-12 230 140)" />
  <use href="#comb" x="500" y="230" transform="rotate(18 500 230)" />
  <use href="#comb" x="60" y="300" transform="rotate(8 60 300)" />
  <use href="#comb" x="650" y="230" transform="rotate(-25 650 230)" />
</svg>