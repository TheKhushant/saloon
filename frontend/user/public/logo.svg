<svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8CBA8"/>
      <stop offset="50%" stop-color="#B4834F"/>
      <stop offset="100%" stop-color="#6B4526"/>
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#1a1512"/>
      <stop offset="100%" stop-color="#0a0807"/>
    </radialGradient>
  </defs>

  <!-- Aura rays -->
  <g stroke="url(#goldGrad)" stroke-width="6" stroke-linecap="round" opacity="0.9">
      <line x1="200.00" y1="94.00" x2="200.00" y2="66.00"/>
      <line x1="239.94" y1="104.06" x2="248.56" y2="78.99"/>
      <line x1="271.68" y1="128.32" x2="292.55" y2="107.45"/>
      <line x1="295.94" y1="160.06" x2="321.01" y2="151.44"/>
      <line x1="306.00" y1="200.00" x2="334.00" y2="200.00"/>
      <line x1="295.94" y1="239.94" x2="321.01" y2="248.56"/>
      <line x1="271.68" y1="271.68" x2="292.55" y2="292.55"/>
      <line x1="239.94" y1="295.94" x2="248.56" y2="321.01"/>
      <line x1="200.00" y1="306.00" x2="200.00" y2="334.00"/>
      <line x1="160.06" y1="295.94" x2="151.44" y2="321.01"/>
      <line x1="128.32" y1="271.68" x2="107.45" y2="292.55"/>
      <line x1="104.06" y1="239.94" x2="78.99" y2="248.56"/>
      <line x1="94.00" y1="200.00" x2="66.00" y2="200.00"/>
      <line x1="104.06" y1="160.06" x2="78.99" y2="151.44"/>
