      <line x1="160.06" y1="104.06" x2="151.44" y2="78.99"/>
  </g>

  <!-- Solid disc behind ring for contrast -->
  <circle cx="200" cy="200" r="102" fill="url(#discGrad)"/>

  <!-- Outer ring -->
  <circle cx="200" cy="200" r="102" fill="none" stroke="url(#goldGrad)" stroke-width="5"/>
  <!-- Inner hairline ring for a jewelled, layered edge -->
  <circle cx="200" cy="200" r="90" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" opacity="0.6"/>

  <!-- Scissors emblem — the salon's craft, centered in the badge -->
  <g transform="translate(133,133) scale(5.6)" fill="none" stroke="url(#goldGrad)" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="6" cy="6" r="3"/>
    <circle cx="6" cy="18" r="3"/>
    <line x1="20" y1="4" x2="8.12" y2="15.88"/>
    <line x1="14.47" y1="14.48" x2="20" y2="20"/>
    <line x1="8.12" y1="8.12" x2="12" y2="12"/>
  </g>

  <!-- Sparkle accent -->
  <path fill="url(#goldGrad)" d="M 200 40 Q 202.3 53.3 216 56 Q 202.3 58.7 200 72 Q 197.7 58.7 184 56 Q 197.7 53.3 200 40 Z"/>
